[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gfriend-python-runtime"
version = "0.1.0"
description = "Python runtime for GFriend test scripts"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
windows = ["pywinauto>=0.6.9; platform_system == 'Windows'"]

[project.scripts]
gfriend-python = "gfriend_python.cli:main"
gfriend-web = "gfriend_python.web:main"
gfriend-run-spec = "gfriend_python.run_spec:main"
gfriend-legacy-report = "gfriend_python.legacy_report:main"
gfriend-summary-report = "gfriend_python.summary_report:main"
gfriend-update = "gfriend_python.updater:main"
gfriend-check-update = "gfriend_python.updater:manifest_main"

[tool.setuptools]
packages = ["gfriend_python"]

[tool.setuptools.package-data]
gfriend_python = ["web_ui.html"]
